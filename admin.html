<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin — SMA Triguna 1956</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#004B87">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script>try{var t=JSON.parse(localStorage.getItem('trg:v1:theme')||'null')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}</script>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/admin.js"></script>
</head>
<body class="adm">
  <!-- LOGIN -->
  <section id="login" class="login" hidden>
    <div class="login-art">
      <img src="assets/logo.svg" alt="" width="84" height="84">
      <h1>SMA Triguna 1956</h1>
      <p>Panel pengelola konten website sekolah. Satu tempat untuk mengatur profil, prestasi, berita, mading, video, brosur, pesan masuk, dan laporan pengunjung.</p>
    </div>
    <form class="login-card card" id="loginForm" novalidate>
      <h2>Masuk Superadmin</h2>
      <p class="muted">Hanya akun terdaftar yang dapat mengakses panel ini.</p>
      <div class="field"><label for="l-user">Username</label><input id="l-user" name="username" autocomplete="username" required value="admin"></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-block" type="submit">Masuk</button>
      <p class="form-msg" role="alert"></p>
      <a class="back" href="index.html">← Kembali ke website</a>
    </form>
  </section>

  <!-- APLIKASI -->
  <div id="app" class="shell" hidden>
    <aside class="side" id="side" aria-label="Menu admin"></aside>
    <div class="side-scrim" id="scrim"></div>
    <div class="main">
      <header class="bar">
        <button class="btn-icon show-md" id="sideBtn" type="button" aria-label="Buka menu"></button>
        <nav class="crumb" id="crumb"></nav>
        <div class="bar-act">
          <span class="sync" id="sync" title="Status sinkron"></span>
          <a class="btn btn-soft btn-sm hide-sm" href="index.html" target="_blank" rel="noopener" id="viewSite"></a>
          <button class="btn-icon" type="button" id="themeBtn" aria-label="Ganti mode" data-theme-icon></button>
          <a class="btn-icon bell" href="#/pesan" id="bell" aria-label="Pesan masuk"></a>
          <button class="btn-icon" type="button" id="logoutBtn" aria-label="Keluar"></button>
        </div>
      </header>
      <main class="pages" id="pages"></main>
    </div>
  </div>

  <aside class="drawer" id="drawer" aria-modal="true" role="dialog" aria-label="Formulir"><div class="drawer-box"></div></aside>
  <div class="modal" id="dialog" role="alertdialog" aria-modal="true"><div class="modal-box dialog-box"></div></div>
</body>
</html>
